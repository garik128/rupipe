[project]
name = "rupipe"
version = "0.1.0"
description = "Russian E-AC3 5.1 track from a 5.1 original and a stereo Russian voice-over in the same MKV"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
pipeline = "rupipe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rupipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
